<!-- Hubby, the friendly StudentHub guide -->
<div class="mascot" aria-hidden="true">
    <svg width="130" height="150" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8b5cf6"/>
                <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
        </defs>
        <!-- antenna -->
        <line x1="65" y1="26" x2="65" y2="10" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
        <circle class="antenna-tip" cx="65" cy="8" r="6" fill="#facc15"/>

        <!-- waving hand (left arm) -->
        <g class="mascot-arm">
            <rect x="18" y="70" width="10" height="26" rx="5" fill="#7c3aed"/>
            <circle cx="23" cy="66" r="8" fill="#a78bfa"/>
        </g>
        <!-- right arm -->
        <rect x="102" y="82" width="10" height="26" rx="5" fill="#7c3aed"/>
        <circle cx="107" cy="108" r="7" fill="#a78bfa"/>

        <!-- head/body -->
        <rect x="26" y="28" width="78" height="72" rx="24" fill="url(#body)"/>
        <!-- face screen -->
        <rect x="36" y="40" width="58" height="42" rx="16" fill="#1e1b4b"/>
        <!-- eyes -->
        <circle class="eye" cx="54" cy="60" r="7" fill="#67e8f9"/>
        <circle class="eye" cx="76" cy="60" r="7" fill="#67e8f9"/>
        <!-- smile -->
        <path d="M52 71 Q65 80 78 71" stroke="#67e8f9" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <!-- cheeks -->
        <circle cx="43" cy="70" r="3.5" fill="#f472b6" opacity="0.7"/>
        <circle cx="87" cy="70" r="3.5" fill="#f472b6" opacity="0.7"/>

        <!-- feet -->
        <rect x="42" y="100" width="16" height="12" rx="6" fill="#4f46e5"/>
        <rect x="72" y="100" width="16" height="12" rx="6" fill="#4f46e5"/>
    </svg>
</div>
